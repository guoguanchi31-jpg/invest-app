server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /healthz {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}

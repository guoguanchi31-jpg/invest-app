x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    volumes:
      - recovery_backups:/app/backups
    environment:
      APP_ENV: production
      AUTO_MIGRATE_ON_STARTUP: "0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_PASSWORD: ${APP_PASSWORD}
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_USER_NAME: ${APP_USER_NAME:-家庭管理员}
      APP_FAMILY_NAME: ${APP_FAMILY_NAME:-我的家庭}
      APP_AUTH_SECRET: ${APP_AUTH_SECRET}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-604800}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-300}
      LOGIN_TRACKED_IDENTITIES: ${LOGIN_TRACKED_IDENTITIES:-10000}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      FINANCIAL_COMMAND_RESPONSE_RETENTION_DAYS: ${FINANCIAL_COMMAND_RESPONSE_RETENTION_DAYS:-90}
      FINANCIAL_COMMAND_RETENTION_BATCH_SIZE: ${FINANCIAL_COMMAND_RETENTION_BATCH_SIZE:-250}
      ENABLE_SNAPSHOT_SCHEDULER: ${ENABLE_SNAPSHOT_SCHEDULER:-1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      BASE_CURRENCY: ${BASE_CURRENCY:-CNY}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Shanghai}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-0}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
        VITE_API_URL: ""
        VITE_USER_NAME: ${VITE_USER_NAME:-冠池}
        VITE_USER_BADGE: ${VITE_USER_BADGE:-个人理财空间}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  recovery_backups:
  postgres_data:
  certbot_webroot:
  letsencrypt:
